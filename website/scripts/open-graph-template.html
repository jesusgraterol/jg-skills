<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>jg-skills Open Graph image</title>
    <style>
      @font-face {
        font-family: 'Ubuntu Sans Variable';
        font-style: normal;
        font-weight: 100 800;
        src: url('../node_modules/@fontsource-variable/ubuntu-sans/files/ubuntu-sans-latin-wght-normal.woff2')
          format('woff2-variations');
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #fefdfb;
        color: #111827;
        font-family: 'Ubuntu Sans Variable', sans-serif;
      }

      .canvas {
        display: flex;
        width: 1200px;
        height: 630px;
        flex-direction: column;
        padding: 56px 64px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 32px;
        border-bottom: 1px solid #dfe3e2;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 22px;
        font-weight: 650;
      }

      .mark {
        width: 48px;
        height: 48px;
      }

      .domain {
        color: #697371;
        font-family: ui-monospace, monospace;
        font-size: 16px;
      }

      .content {
        display: grid;
        flex: 1;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 64px;
        align-items: center;
      }

      .eyebrow {
        margin: 0 0 20px;
        color: #006c57;
        font-family: ui-monospace, monospace;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 620px;
        margin: 0;
        font-size: 72px;
        font-variation-settings: 'wght' 650;
        letter-spacing: -3.5px;
        line-height: 1.02;
      }

      h1 span {
        color: #006c57;
      }

      .thesis {
        max-width: 600px;
        margin: 26px 0 0;
        color: #586360;
        font-size: 26px;
        font-weight: 450;
        line-height: 1.35;
      }

      .session {
        overflow: hidden;
        border-radius: 16px;
        background: #0d0d0d;
        color: #f4f6f1;
        font-family: ui-monospace, monospace;
      }

      .session-title {
        padding: 16px 22px;
        border-bottom: 1px solid rgba(244, 246, 241, 0.15);
        color: rgba(244, 246, 241, 0.7);
        font-size: 14px;
      }

      .session-list {
        display: grid;
        gap: 4px;
        margin: 0;
        padding: 18px 22px;
        list-style: none;
        font-size: 19px;
        font-weight: 700;
      }

      .session-list span {
        color: #76c8ad;
      }
    </style>
  </head>
  <body>
    <main
      class="canvas"
      aria-label="jg-skills social preview"
    >
      <div class="topbar">
        <div class="brand">
          <svg
            class="mark"
            viewBox="0 0 64 64"
            aria-hidden="true"
          >
            <rect
              x="2"
              y="2"
              width="60"
              height="60"
              rx="12"
              fill="#111827"
            />
            <!-- keep the tspans adjacent: whitespace between them renders as a gap -->
            <!-- prettier-ignore -->
            <text
              x="32"
              y="42"
              text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace"
              font-size="28"
              font-weight="800"
              letter-spacing="-2"
            >
              <tspan fill="#f8fafc">JG</tspan><tspan fill="#6ee7b7">/</tspan>
            </text>
          </svg>
          <span>jg-skills</span>
        </div>
        <span class="domain">jg-skills.jesusgraterol.dev</span>
      </div>

      <div class="content">
        <div>
          <p class="eyebrow">Agent Skills for professional development</p>
          <h1>Battle-tested skills <span>for coding agents.</span></h1>
          <p class="thesis">Used by professional software developers on real projects.</p>
        </div>

        <div class="session">
          <div class="session-title">skills for your workflow</div>
          <!-- filled with every explicit skill, in catalog order, by generate-open-graph.ts -->
          <ul class="session-list"></ul>
        </div>
      </div>
    </main>
  </body>
</html>
